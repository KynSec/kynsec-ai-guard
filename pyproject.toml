[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-guard"
description = "Security auditor for local AI agent configurations, MCP servers, system prompts, and LLM deployment files."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "KynSec" }]
keywords = ["ai", "security", "mcp", "llm", "agents", "sast", "devsecops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pyyaml>=6.0.1",
  "pydantic>=2.6.0",
  "tomli>=2.0.1; python_version < '3.11'",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
ai-guard = "ai_guard.cli:app"

[project.urls]
Homepage = "https://github.com/KynSec/AI-Guard-CLI"
Repository = "https://github.com/KynSec/AI-Guard-CLI"
Issues = "https://github.com/KynSec/AI-Guard-CLI/issues"
Changelog = "https://github.com/KynSec/AI-Guard-CLI/releases"
PyPI = "https://pypi.org/project/ai-guard/"

[tool.setuptools.dynamic]
version = { attr = "ai_guard.__version__" }

[tool.setuptools.packages.find]
include = ["ai_guard*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["ai_guard"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["ai_guard", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "B008",  # Typer options are function calls in defaults by design.
  "RUF001",  # Intentional typographic characters in user-facing strings.
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
